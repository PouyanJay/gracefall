name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The view extra is Pillow only. Installing it here means the shim's
      # tests actually run rather than silently skipping.
      - run: pip install -e ".[view]" pytest
      # The same target you run locally, so the two cannot drift. There is
      # no uv here, so the Makefile falls through to this interpreter.
      - run: make test
