<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="gracefall">
  <!--
    The gracefall mark. Same axis, two renderings: the stepped bars of the
    fallback text fade into the smooth curve a drawing terminal shows, and
    back. Built from two Hugeicons free icons (Waterfall Down 01 and Chart
    Spline, MIT), which happen to share the same axis path.
  -->
  <style>
    .bars   { animation: bars 6s ease-in-out infinite; }
    .curve  { animation: curve 6s ease-in-out infinite; }
    @keyframes bars  { 0%,38% { opacity: 1 } 50%,88% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes curve { 0%,38% { opacity: 0 } 50%,88% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .bars, .curve { animation: none; }
      .curve { opacity: 0.55; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#171921"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g transform="translate(16 16) scale(4)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- axis, shared by both renderings -->
    <path d="M21 21H10C6.70017 21 5.05025 21 4.02513 19.9749C3 18.9497 3 17.2998 3 14V3" stroke="#8b94a6"/>
    <!-- the fallback: stepped bars, falling -->
    <g class="bars" stroke="#5fe3c0">
      <path d="M8 11L8 5"/>
      <path d="M12 14L12 11"/>
      <path d="M16 14L16 8"/>
      <path d="M20 17L20 14"/>
    </g>
    <!-- the drawing: one smooth curve through the same shape -->
    <g class="curve" stroke="#5fe3c0">
      <path d="M8 8C9.2 8 10.4 12.5 12 12.5C13.6 12.5 14.4 11 16 11C17.6 11 18.6 15.5 20 15.5"/>
    </g>
  </g>
</svg>
